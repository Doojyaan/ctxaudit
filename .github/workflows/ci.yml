name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test on the bundled example
        shell: bash
        run: |
          node dist/cli.js examples/bloated-agent --json > report.json
          node -e "
            const r = require('./report.json');
            if (r.preflightTokens <= 0) throw new Error('expected a non-zero pre-flight cost');
            if (r.collisions.length !== 2) throw new Error('expected 2 skill collisions, got ' + r.collisions.length);
            if (r.mcpServers.length !== 3) throw new Error('expected 3 MCP servers');
            console.log('smoke ok:', r.preflightTokens, 'tokens');
          "
          rm -f report.json

      - name: Budget gate must fail when over budget
        shell: bash
        run: |
          set +e
          node dist/cli.js examples/bloated-agent --budget 1 > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from the budget gate, got $code"
            exit 1
          fi
          echo "budget gate ok"
